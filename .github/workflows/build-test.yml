on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

name: Test
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["minimum", "1.25", "stable"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go != 'minimum' && matrix.go || '' }}
        go-version-file: ${{ matrix.go == 'minimum' && 'go.mod' || '' }}
        check-latest: true

    - name: Test
      run: go test -p 2 ./...
      env:
        GOMAXPROCS: "2"

    - name: Vet
      run: go vet -p 2 ./...
      env:
        GOMAXPROCS: "2"

    - name: Build
      run: go build -p 2 ./...
      env:
        GOMAXPROCS: "2"
